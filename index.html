<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge;chrome=1">
    <title>LaunchDarkly tutorial</title>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <!-- Osmo, the LaunchDarkly mark (official brand asset), shown when the flag is on. -->
    <svg id="osmo" class="osmo" viewBox="0 0 64 64" fill="currentColor" role="img" aria-label="LaunchDarkly Osmo" hidden>
      <path d="M32.62 60.61c-.445 0-.892-.254-1.147-.7-.191-.444-.191-.889.128-1.27l13.582-18.62-23.785 9.66c-.191.063-.319.126-.51.126-.574 0-1.084-.38-1.212-.89-.191-.508.064-1.08.51-1.397l20.916-12.266-36.794-2.097c-.765-.063-1.211-.635-1.211-1.27 0-.573.382-1.208 1.211-1.272l36.794-2.097-20.916-12.265c-.446-.318-.701-.89-.51-1.398.192-.509.638-.89 1.212-.89.191 0 .319.063.51.127l23.785 9.66L31.601 5.067c-.255-.381-.32-.89-.128-1.271.191-.445.638-.7 1.148-.7.319 0 .638.128.893.382L60.55 30.36c.383.381.574.953.574 1.462 0 .508-.191 1.016-.574 1.461L33.514 60.23a1.261 1.261 0 0 1-.893.38Z"/>
    </svg>
    <script type="module">
    import { createClient } from 'https://unpkg.com/@launchdarkly/js-client-sdk@4/dist/index.js';

    async function main()
    {
      // Set clientSideID to your LaunchDarkly client-side ID
      const clientSideID = '';

      // Set flagKey to the feature flag key you want to evaluate
      const flagKey = 'sample-feature-dtm';

      // Set useStaging to true to connect to LaunchDarkly staging. Otherwise the
      // SDK uses its default production endpoints.
      const useStaging = false;

      // Set up the evaluation context. This context should appear on your
      // LaunchDarkly contexts dashboard soon after you run the demo.
      const context = {
        kind: 'user',
        key: 'example-user-key',
        name: 'Sandy'
      };

      var div = document.createElement('div');
      document.body.appendChild(div);
      div.appendChild(document.createTextNode('Initializing...'));

      if (clientSideID === '') {
        div.replaceChild(document.createTextNode('Please edit index.html to set clientSideID to your LaunchDarkly client-side ID first'), div.firstChild);
        return;
      }

      const stagingEndpoints = {
        baseUri: 'https://ld-stg.launchdarkly.com',
        streamUri: 'https://clientstream-stg.launchdarkly.com',
        eventsUri: 'https://events-stg.launchdarkly.com',
      };

      const ldclient = createClient(clientSideID, context, useStaging ? stagingEndpoints : {});
      const osmo = document.getElementById('osmo');

      function render() {
        const flagValue = ldclient.variation(flagKey, false);
        const label = `The ${flagKey} feature flag evaluates to ${flagValue}.`;
        document.body.style.background = flagValue ? '#00844B' : '#373841';
        osmo.toggleAttribute('hidden', !flagValue);
        div.replaceChild(document.createTextNode(label), div.firstChild);
      }

      // Only render flag values once the SDK has initialized. Before that, the
      // SDK may emit values cached from an earlier session.
      let initialized = false;
      ldclient.on('change', () => {
        if (initialized) {
          render();
        }
      });

      const result = await ldclient.start();
      if (result.status === 'complete') {
        initialized = true;
        render();
      } else {
        div.replaceChild(document.createTextNode('SDK failed to initialize'), div.firstChild);
      }
    }
    main();
    </script>
  </body>
</html>
